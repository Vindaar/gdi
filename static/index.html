<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Log</title>
<!-- installable web app; use-credentials: behind HTTP basic auth the manifest
     request must carry the login, or it gets a 401 and install is refused -->
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="css/app.css">
<script>
  // apply the chosen theme before the first paint (Settings → Theme)
  try { const t = localStorage.getItem('gdi:theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch {}
</script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/uPlot.iife.min.js"></script>
<script src="vendor/echarts.min.js"></script>
</head>

<header class="topbar">
  <a class="brand" href="#/">Training Log</a>

    <a href="#/analysis" data-nav="analysis">Analysis</a>
    <a href="#/health" data-nav="health">Health</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <span class="status" id="status"></span>
  <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
    <span id="nav-current">Menu</span> <span aria-hidden="true">☰</span></button>
